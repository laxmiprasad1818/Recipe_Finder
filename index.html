<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🍲 Smart Recipe Finder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- 🔐 LOGIN SECTION -->
  <div class="container" id="loginSection">
    <h2>🔐 Login to Smart Recipe Finder</h2>
    <input type="text" id="username" placeholder="👤 Username" />
    <input type="password" id="password" placeholder="🔒 Password" />
    <button id="loginBtn">🚪 Login</button>
    <p id="loginError" class="error-msg"></p>
  </div>

  <!-- 🧑‍🍳 MAIN APP SECTION -->
  <div class="container" id="appSection" style="display: none;">
    <h1>🍲 Smart Recipe Finder</h1>

    <!-- INGREDIENTS SEARCH -->
    <textarea id="ingredients" placeholder="📝 Enter ingredients (e.g., tomato, onion, chicken)..."></textarea>

    <!-- FILTER OPTIONS -->
    <div class="row">
      <label><input type="radio" name="type" value="veg" checked /> 🟢 Veg</label>
      <label><input type="radio" name="type" value="non-veg" /> 🔴 Non-Veg</label>
      <label><input type="radio" name="type" value="both" /> 🟡 Both</label>
    </div>

    <div class="row">
      <label for="timeDropdown">⏱️ Max Cooking Time:</label>
      <select id="timeDropdown">
        <option value="15">15 minutes</option>
        <option value="30">30 minutes</option>
        <option value="45">45 minutes</option>
        <option value="60">60 minutes</option>
        <option value="90">90 minutes</option>
      </select>
    </div>

    <!-- 🔍 SEARCH BUTTON -->
    <button id="sendBtn">🔍 Get Recipes</button>

    <!-- 📌 FEATURED RECIPES -->
    <h2>🌟 Featured Recipes</h2>
    <div id="featured-recipes" class="recipe-container"></div>

    <!-- 📋 SEARCH RESULTS -->
    <h2>🔎 Search Results</h2>
    <div id="search-results" class="recipe-container"></div>
  </div>

  <!-- JS FILE -->
  <script src="script.js"></script>
   <script src="config.js"></script>
</body>
</html>
